<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="100%" height="100%" fill="#080808" />
  
      <defs>
        <linearGradient id="cinemaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#181716" />
          <stop offset="50%" stop-color="#101010" />
          <stop offset="100%" stop-color="#060606" />
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#cinemaGrad)" />
      <!-- Letterbox cinemascope bars -->
      <rect x="0" y="0" width="1600" height="120" fill="#050505" />
      <rect x="0" y="880" width="1600" height="120" fill="#050505" />
      <line x1="0" y1="120" x2="1600" y2="120" stroke="#ffffff" stroke-opacity="0.08" />
      <line x1="0" y1="880" x2="1600" y2="880" stroke="#ffffff" stroke-opacity="0.08" />
      <!-- Cinematic lens focal ring -->
      <circle cx="800" cy="500" r="160" stroke="#C5A880" stroke-opacity="0.3" stroke-width="1.5" fill="none" />
      <circle cx="800" cy="500" r="220" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" fill="none" stroke-dasharray="6 12" />
      <circle cx="800" cy="500" r="6" fill="#C5A880" />
    

  <!-- Grain overlay simulation & luxury typography -->
  <g font-family="'Helvetica Neue', 'Arial', sans-serif">
    <!-- Top label -->
    <text x="60" y="80" fill="#999999" font-size="13" letter-spacing="4" font-weight="500">NOVA ARCHIVAL SOUND</text>
    <text x="1540" y="80" text-anchor="end" fill="#999999" font-size="13" letter-spacing="4">MMXXVI</text>

    <!-- Bottom metadata -->
    <text x="60" y="900" fill="#C5A880" font-size="12" letter-spacing="5" font-weight="600">PHOTO II / ATACAMA</text>
    <text x="60" y="940" fill="#F5F2EC" font-size="28" letter-spacing="6" font-weight="700">DESERT MONOLITH</text>
    <text x="1540" y="940" text-anchor="end" fill="#777777" font-size="12" letter-spacing="3">CAT. NV-409-LP</text>
  </g>
</svg>